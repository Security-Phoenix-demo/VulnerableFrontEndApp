server:
  port: 8080
spring:
  application:
    name: java-service
  datasource:
    url: jdbc:h2:mem:findings;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: always
demo:
  jwt:
    secret: change-me-in-production
